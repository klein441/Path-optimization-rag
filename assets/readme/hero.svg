<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">物流运输路径智能优化系统</title>
  <desc id="desc">物流路径优化系统：从工厂分配、起运港比价到目的港交付，结合规则引擎与自适应 Agentic RAG 输出可溯源推荐方案。</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7FAFF"/>
      <stop offset="0.55" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EFF6FF"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#2563EB"/>
    </marker>
  </defs>

  <rect width="1200" height="440" rx="30" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="438" rx="29" fill="none" stroke="#DCE7F5" stroke-width="2"/>

  <g id="title-block" transform="translate(64 64)">
    <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="600" letter-spacing="3" fill="#2563EB">LOGISTICS · ROUTE OPTIMIZATION · RAG</text>

    <text x="-4" y="72" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="58" font-weight="800" fill="#0F172A">物流运输路径</text>
    <text x="-4" y="138" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="58" font-weight="800" fill="#0F172A">智能优化系统</text>

    <rect x="0" y="166" width="44" height="8" rx="4" fill="url(#accent)"/>

    <text x="0" y="214" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" fill="#526078">成本、时效、稳定性多维度综合权衡，</text>
    <text x="0" y="248" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" fill="#526078">输出可解释、可溯源的物流路径推荐方案。</text>

    <g transform="translate(0 280)">
      <rect x="0" y="0" width="172" height="44" rx="22" fill="#FFFFFF" stroke="#DCE7F5" stroke-width="1.5"/>
      <text x="86" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" fill="#1D4ED8">确定性成本计算</text>

      <rect x="188" y="0" width="222" height="44" rx="22" fill="#FFFFFF" stroke="#DCE7F5" stroke-width="1.5"/>
      <text x="299" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" fill="#1D4ED8">自适应 Agentic RAG</text>

      <rect x="426" y="0" width="206" height="44" rx="22" fill="#FFFFFF" stroke="#DCE7F5" stroke-width="1.5"/>
      <text x="529" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" fill="#1D4ED8">费用 · 时效 · 证据</text>
    </g>

    <g transform="translate(0 356)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#8494AB">
      <text x="0" y="0">7 张核心数据表</text>
      <text x="212" y="0">5 份分析报告</text>
      <text x="416" y="0">RULE + LLM + RAG</text>
    </g>
  </g>

  <g id="proof-card" transform="translate(690 66)">
    <rect width="446" height="308" rx="24" fill="#FFFFFF" stroke="#DCE7F5" stroke-width="1.5"/>

    <text x="30" y="42" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#0F172A">推荐流水线</text>
    <text x="30" y="68" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" letter-spacing="1.5" fill="#8494AB">RECOMMEND PIPELINE</text>

    <line x1="30" y1="88" x2="416" y2="88" stroke="#E8F0FC" stroke-width="2"/>

    <g transform="translate(0 122)">
      <circle cx="74" cy="28" r="32" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
      <text x="74" y="36" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#1D4ED8">工厂</text>

      <line x1="112" y1="28" x2="176" y2="28" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow)"/>

      <circle cx="198" cy="28" r="32" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
      <text x="198" y="36" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#1D4ED8">始发港</text>

      <line x1="236" y1="28" x2="300" y2="28" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow)"/>

      <circle cx="322" cy="28" r="32" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
      <text x="322" y="36" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#1D4ED8">目的港</text>

      <text x="74" y="96" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" fill="#526078">分配规则</text>
      <text x="198" y="96" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" fill="#526078">合约比价</text>
      <text x="322" y="96" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" fill="#526078">反思校验</text>
    </g>

    <g transform="translate(24 250)">
      <rect x="0" y="0" width="88" height="34" rx="17" fill="#F7FAFF" stroke="#DCE7F5"/>
      <text x="44" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" fill="#1D4ED8">费用明细</text>

      <rect x="100" y="0" width="88" height="34" rx="17" fill="#F7FAFF" stroke="#DCE7F5"/>
      <text x="144" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" fill="#1D4ED8">时效约束</text>

      <rect x="200" y="0" width="88" height="34" rx="17" fill="#F7FAFF" stroke="#DCE7F5"/>
      <text x="244" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" fill="#1D4ED8">风险提示</text>

      <rect x="300" y="0" width="88" height="34" rx="17" fill="#F7FAFF" stroke="#DCE7F5"/>
      <text x="344" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" fill="#1D4ED8">引用溯源</text>
    </g>
  </g>
</svg>
