<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>登录 — 物流路径推荐系统</title>
    <link rel="stylesheet" type="text/css" href="assets/css/index.css" />
    <style>
        /* index.css 已作用域化到 #login-overlay，登录页直接使用 */
    </style>
</head>
<body>
    <div id="login-overlay">
        <div class="bg">
            <div class="wel">物流路径推荐系统</div>
            <div class="user">
                <div id="yonghu">用户名</div>
                <input type="text" id="login-username" value="admin" />
            </div>
            <div class="password">
                <div id="yonghu">密&nbsp;&nbsp;&nbsp;码</div>
                <input type="password" id="login-password" value="admin123" />
            </div>
            <div class="rem">
                <input type="checkbox" id="login-remember" />
                <div id="reb">记住密码</div>
            </div>
            <div class="fg">
                <a href="#">忘记密码？</a>
            </div>
            <button class="btn" id="login-btn">登 录</button>
            <button class="btn login-register-btn" id="register-btn">注 册</button>
        </div>
    </div>

    <script>
    (function() {
        var btn = document.getElementById('login-btn');
        var regBtn = document.getElementById('register-btn');
        var userInput = document.getElementById('login-username');
        var passInput = document.getElementById('login-password');

        regBtn.addEventListener('click', function() {
            window.location.href = 'register.html';
        });

        btn.addEventListener('click', async function() {
            var username = userInput.value.trim();
            var password = passInput.value.trim();

            if (!username || !password) {
                alert('请输入用户名和密码');
                return;
            }

            try {
                var resp = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: username, password: password })
                });
                var data = await resp.json();
                if (data.success) {
                    window.location.href = '/app';
                    return;
                }
                alert(data.error || '用户名或密码错误');
                return;
            } catch (e) {
                // 后端不可用时保留本地兜底
            }

            var users = {};
            try {
                users = JSON.parse(localStorage.getItem('logistics_users') || '{}');
            } catch (e) {
                users = {};
            }

            if ((username === 'admin' && password === 'admin123') || (users[username] && users[username] === password)) {
                window.location.href = '/app';
            } else {
                alert('用户名或密码错误');
            }
        });

        passInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                btn.click();
            }
        });
    })();
    </script>
</body>
</html>
